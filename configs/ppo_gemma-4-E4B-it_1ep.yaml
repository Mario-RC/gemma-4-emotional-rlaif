### model
model_name_or_path: google/gemma-4-E4B-it
adapter_name_or_path: saves/gemma-4-E4B-it/lora/sft_3ep
reward_model: saves/gemma-4-E4B-it/lora/rm_1ep
cache_dir: .cache/huggingface
trust_remote_code: true

### method
stage: ppo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: ppo_unlabeled_prompts_dataset
dataset_dir: datasets
template: gemma4n
enable_thinking: false
cutoff_len: 2048
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: saves/gemma-4-E4B-it/lora/ppo_1ep
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
auto_find_batch_size: true
gradient_checkpointing: true
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### generate
max_new_tokens: 512
top_k: 0
top_p: 0.9
